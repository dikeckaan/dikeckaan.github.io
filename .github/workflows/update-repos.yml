name: Update repo list

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/build-site.mjs
      - name: Commit if changed
        id: commit
        run: |
          # The timestamp alone changing is not worth a commit.
          if git diff --quiet -I'"generated"' -I'"dateModified"' -- data/repos.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json index.html projects.html llms.txt llms-full.txt sitemap.xml
          git commit -m "Update repo list"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Tell IndexNow (Bing, Yandex, Seznam, Naver…)
        if: steps.commit.outputs.changed == 'true'
        run: |
          sleep 90  # let GitHub Pages publish first
          .github/indexnow.sh
